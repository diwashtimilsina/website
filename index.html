<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlatformMGT</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#06080d; --surface:#0d1117; --surface2:#161b22; --surface3:#1c2333;
  --border:rgba(255,255,255,.06); --border2:rgba(255,255,255,.1); --border3:rgba(255,255,255,.15);
  --accent:#4f8ff7; --accent2:#3672d9; --accentGlow:rgba(79,143,247,.12);
  --green:#2dd4a0; --greenBg:rgba(45,212,160,.1); --greenBdr:rgba(45,212,160,.25);
  --amber:#f0b429; --amberBg:rgba(240,180,41,.1); --amberBdr:rgba(240,180,41,.25);
  --red:#f25c5c; --redBg:rgba(242,92,92,.1); --redBdr:rgba(242,92,92,.25);
  --purple:#a78bfa; --purpleBg:rgba(167,139,250,.1);
  --text:#d1d5db; --textBright:#f3f4f6; --muted:#6b7280; --dim:#374151;
  --sidebar:220px; --topbar:52px;
  --font:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --radius:8px; --radiusLg:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--accentGlow);color:var(--accent)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}

/* AUTH */
#auth{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,rgba(79,143,247,.04) 0%,transparent 60%)}
.auth-box{width:360px}
.auth-brand{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.auth-title{font-size:22px;font-weight:600;color:var(--textBright);margin-bottom:24px}
.auth-hint{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:20px;font-size:11px;color:var(--muted);line-height:1.8;font-family:var(--mono)}
.auth-hint b{color:var(--text)}

/* FORM */
label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500;letter-spacing:.3px;text-transform:uppercase}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:8px 11px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentGlow)}
select option{background:var(--surface2)}
.fg{margin-bottom:12px}
.row{display:flex;gap:10px}.row>*{flex:1}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .12s;display:inline-flex;align-items:center;gap:5px;font-family:var(--font)}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-p:hover{background:var(--accent2)}
.btn-s{background:var(--greenBg);color:var(--green);border-color:var(--greenBdr)}.btn-s:hover{background:rgba(45,212,160,.18)}
.btn-d{background:var(--redBg);color:var(--red);border-color:var(--redBdr)}.btn-d:hover{background:rgba(242,92,92,.18)}
.btn-g{background:transparent;color:var(--muted);border-color:var(--border2)}.btn-g:hover{background:var(--surface2);color:var(--text);border-color:var(--border3)}
.btn-w{background:var(--amberBg);color:var(--amber);border-color:var(--amberBdr)}.btn-w:hover{background:rgba(240,180,41,.18)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* LAYOUT */
#app{display:none;min-height:100vh}
#sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;z-index:50;display:flex;flex-direction:column;overflow-y:auto}
.sb-brand{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.sb-logo{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent)}
.sb-ver{font-size:9px;color:var(--dim);letter-spacing:1px;margin-top:1px}
.sb-user{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.sb-role{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
.sb-name{font-size:12px;font-weight:600;color:var(--textBright);margin-top:1px}
.nav-sec{padding:6px 0}
.nav-lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;padding:6px 14px 3px}
.nav-i{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;color:var(--muted);font-size:12px;border-left:2px solid transparent;transition:all .12s}
.nav-i:hover{background:var(--surface2);color:var(--text)}
.nav-i.act{background:var(--accentGlow);color:var(--accent);border-left-color:var(--accent)}
.nav-ic{width:14px;text-align:center;font-size:11px;flex-shrink:0;opacity:.7}
.sb-out{margin:auto 12px 12px;padding:7px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;border-radius:6px;font-size:11px;font-family:var(--font);width:calc(100% - 24px);transition:all .12s}
.sb-out:hover{background:var(--redBg);color:var(--red);border-color:var(--redBdr)}

#main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:var(--topbar);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.pg-title{font-size:14px;font-weight:600;color:var(--textBright)}
.tb-act{display:flex;gap:6px;align-items:center}
#content{padding:20px;flex:1}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-v{font-size:22px;font-weight:700;line-height:1;color:var(--textBright)}
.stat-l{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.6px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radiusLg);overflow:hidden}
.card-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-t{font-size:13px;font-weight:600;color:var(--textBright)}
.card-b{padding:14px 16px}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--surface2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:8px 12px;text-align:left;font-weight:500}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.01)}
.td-a{display:flex;gap:4px;flex-wrap:wrap}

/* BADGE */
.bdg{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500}
.bdg-g{background:var(--greenBg);color:var(--green)}.bdg-r{background:var(--redBg);color:var(--red)}
.bdg-a{background:var(--amberBg);color:var(--amber)}.bdg-b{background:var(--accentGlow);color:var(--accent)}
.bdg-p{background:var(--purpleBg);color:var(--purple)}.bdg-m{background:rgba(107,114,128,.12);color:var(--muted)}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.mo-box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radiusLg);width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.mo-h{padding:14px 18px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mo-t{font-size:14px;font-weight:600;color:var(--textBright)}
.mo-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px}
.mo-x:hover{color:var(--red)}
.mo-b{padding:14px 18px}
.mo-f{padding:10px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px}

/* ALERT */
.alert{padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:12px}
.alert-e{background:var(--redBg);border:1px solid var(--redBdr);color:#fca5a5}
.alert-s{background:var(--greenBg);border:1px solid var(--greenBdr);color:#6ee7b7}

/* MISC */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ph h2{font-size:17px;font-weight:700;color:var(--textBright)}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:8px 14px;cursor:pointer;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab.act{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.empty{text-align:center;padding:32px;color:var(--muted);font-size:12px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
.tg{color:var(--green)}.tr{color:var(--red)}.ta{color:var(--amber)}.tm{color:var(--muted)}
.mt{margin-top:10px}
.sep{height:1px;background:var(--border);margin:14px 0}
.hidden{display:none!important}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{padding-left:30px}
.search-wrap::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-box">
    <div class="auth-brand">PlatformMGT</div>
    <div class="auth-title">Sign in</div>
    <div class="auth-hint">
      <b>superadmin</b> / superadmin123<br>
      <b>platform_demo</b> / platform123<br>
      <b>emp_demo</b> / employee123
    </div>
    <div id="auth-err" class="alert alert-e hidden"></div>
    <div class="fg"><label>Username</label><input id="l-user" placeholder="username" /></div>
    <div class="fg"><label>Password</label><input id="l-pass" type="password" placeholder="password" /></div>
    <button class="btn btn-p btn-full" onclick="doLogin()" style="margin-top:4px;padding:9px">Sign In →</button>
    <div class="fg" style="margin-top:14px"><label>Backend URL</label><input id="l-url" value="http://202.79.51.254:8001" /></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="sidebar">
    <div class="sb-brand"><div class="sb-logo">PlatformMGT</div><div class="sb-ver">v2.1.0</div></div>
    <div class="sb-user"><div class="sb-role" id="sb-role">—</div><div class="sb-name" id="sb-name">—</div></div>
    <div id="sb-nav"></div>
    <button class="sb-out" onclick="doLogout()">Sign Out</button>
  </div>
  <div id="main">
    <div id="topbar"><div class="pg-title" id="tb-title">Dashboard</div><div class="tb-act" id="tb-act"></div></div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div id="mo-wrap" class="mo hidden" onclick="if(event.target===this)closeMo()">
  <div class="mo-box">
    <div class="mo-h"><div class="mo-t" id="mo-title"></div><button class="mo-x" onclick="closeMo()">×</button></div>
    <div class="mo-b" id="mo-body"></div>
    <div class="mo-f" id="mo-foot"></div>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let S={token:null,rtoken:null,user:null,role:null,utype:null,page:'dashboard',api:'http://202.79.51.254:8001'};

// ─── API ──────────────────────────────────────────────────────────────────────
async function api(m,p,b=null){
  const h={'Content-Type':'application/json'};
  if(S.token)h['Authorization']=`Bearer ${S.token}`;
  const o={method:m,headers:h};if(b)o.body=JSON.stringify(b);
  let res=await fetch(S.api+p,o);
  if(res.status===401&&S.rtoken){
    const r2=await fetch(S.api+'/api/v1/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.rtoken})});
    if(r2.ok){const d=await r2.json();S.token=d.access_token;S.rtoken=d.refresh_token;h['Authorization']=`Bearer ${S.token}`;res=await fetch(S.api+p,{...o,headers:h});}
    else{doLogout();return;}
  }
  if(!res.ok){const e=await res.json();throw e;}
  if(res.status===204)return null;
  return res.json();
}
const GET=p=>api('GET',p),POST=(p,b)=>api('POST',p,b),PATCH=(p,b)=>api('PATCH',p,b),DEL=p=>api('DELETE',p),PUT=(p,b)=>api('PUT',p,b);

// ─── AUTH ─────────────────────────────────────────────────────────────────────
async function doLogin(){
  const u=document.getElementById('l-user').value.trim(),pw=document.getElementById('l-pass').value,url=document.getElementById('l-url').value.trim();
  S.api=url||'http://202.79.51.254:8001';
  const errEl=document.getElementById('auth-err');errEl.classList.add('hidden');
  try{
    const d=await POST('/api/v1/auth/login',{username:u,password:pw});
    S.token=d.access_token;S.rtoken=d.refresh_token;S.role=d.role;S.utype=d.user_type;
    S.user=await GET('/api/v1/auth/me');
    initApp();
  }catch(e){errEl.textContent=e.detail||'Login failed';errEl.classList.remove('hidden');}
}
function doLogout(){S={token:null,rtoken:null,user:null,role:null,utype:null,page:'dashboard',api:S.api};document.getElementById('app').style.display='none';document.getElementById('auth').style.display='flex';}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function initApp(){
  document.getElementById('auth').style.display='none';document.getElementById('app').style.display='flex';
  document.getElementById('sb-role').textContent=S.role.replace('_',' ').toUpperCase();
  document.getElementById('sb-name').textContent=S.user.full_name||S.user.name||S.user.username;
  buildNav();nav('dashboard');
}

function buildNav(){
  const r=S.role,sa=r==='super_admin',pa=r==='platform_account',emp=r==='employee';
  let sections=[];
  sections.push({l:'Overview',items:[{id:'dashboard',ic:'◇',l:'Dashboard'}]});
  if(sa)sections.push({l:'System',items:[{id:'platforms',ic:'◈',l:'Platforms'},{id:'admin-users',ic:'◎',l:'Admin users'}]});
  if(sa||pa)sections.push({l:'Operations',items:[{id:'groups',ic:'▦',l:'Groups'},{id:'employees',ic:'●',l:'Employees'},{id:'games',ic:'◆',l:'Games'}]});
  sections.push({l:'Daily work',items:[{id:'pages',ic:'▣',l:'Pages'},{id:'depositors',ic:'◐',l:'Depositors'}]});
  if(sa||pa)sections.push({l:'HR',items:[{id:'salary-cuts',ic:'✂',l:'Salary cuts'}]});
  sections.push({l:'Tracking',items:[{id:'follower-logs',ic:'↗',l:'Follower logs'}]});
  if(emp)sections.push({l:'My account',items:[{id:'my-salary',ic:'$',l:'My salary'}]});
  sections.push({l:'Analytics',items:[{id:'reports',ic:'▤',l:'Reports'}]});
  let h='';
  for(const s of sections){h+=`<div class="nav-sec"><div class="nav-lbl">${s.l}</div>`;for(const i of s.items)h+=`<div class="nav-i" id="nav-${i.id}" onclick="nav('${i.id}')"><span class="nav-ic">${i.ic}</span>${i.l}</div>`;h+='</div>';}
  document.getElementById('sb-nav').innerHTML=h;
}

function nav(p){
  S.page=p;document.querySelectorAll('.nav-i').forEach(e=>e.classList.remove('act'));
  const n=document.getElementById('nav-'+p);if(n)n.classList.add('act');
  document.getElementById('tb-act').innerHTML='';
  (PAGES[p]||showEmpty)();
}
function setTitle(t){document.getElementById('tb-title').textContent=t}
function setAct(h){document.getElementById('tb-act').innerHTML=h}
function render(h){document.getElementById('content').innerHTML=h}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function $(id){return document.getElementById(id)}
function money(n){return parseFloat(n||0).toLocaleString('en-US',{minimumFractionDigits:2})}
function num(n){return parseInt(n||0).toLocaleString()}
function bdg(s){const m={active:'g',suspended:'a',archived:'m',closed:'m',resigned:'m',inactive:'m',blocked:'r',paused:'a',cashin:'g',cashout:'r',add:'g',deduct:'r',VIP:'b',VVIP:'p',super_admin:'p',platform_account:'b',employee:'g'};return `<span class="bdg bdg-${m[s]||'b'}">${s}</span>`}
function monthNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function toast(msg,type='s'){const el=document.createElement('div');el.className=`alert alert-${type}`;el.style.cssText='position:fixed;top:16px;right:16px;z-index:9999;min-width:240px;animation:slideIn .2s ease;font-size:12px';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
function openMo(title,body,foot){$('mo-title').textContent=title;$('mo-body').innerHTML=body;$('mo-foot').innerHTML=foot;$('mo-wrap').classList.remove('hidden')}
function closeMo(){$('mo-wrap').classList.add('hidden')}
function confirmDel(name,cb){const v=prompt(`⚠️ PERMANENT DELETE\n\nType "${name}" to confirm:`);if(v===name)cb();else if(v!==null)toast('Name mismatch — cancelled','e')}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
async function showDashboard(){
  setTitle('Dashboard');render('<div class="empty"><div class="spinner"></div></div>');
  try{
    if(S.role==='super_admin'){
      const[pf,au]=await Promise.all([GET('/api/v1/platforms'),GET('/api/v1/admin-users')]);
      render(`<div class="stats">
        <div class="stat"><div class="stat-v tg">${pf.length}</div><div class="stat-l">Platforms</div></div>
        <div class="stat"><div class="stat-v ta">${au.length}</div><div class="stat-l">Admin users</div></div>
        <div class="stat"><div class="stat-v tg">${pf.filter(p=>p.status==='active').length}</div><div class="stat-l">Active</div></div>
        <div class="stat"><div class="stat-v tr">${pf.filter(p=>p.status!=='active').length}</div><div class="stat-l">Inactive</div></div>
      </div>
      <div class="card"><div class="card-h"><div class="card-t">All platforms</div></div><div class="tw"><table>
        <thead><tr><th>Name</th><th>Status</th><th>Description</th><th>Created</th></tr></thead>
        <tbody>${pf.map(p=>`<tr><td><b>${p.name}</b></td><td>${bdg(p.status)}</td><td class="tm">${p.description||'—'}</td><td class="tm">${new Date(p.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody>
      </table></div></div>`);
    }else if(S.role==='platform_account'){
      const pid=S.user.platform_id;
      const[pf,gr,em]=await Promise.all([GET(`/api/v1/platforms/${pid}`),GET('/api/v1/groups'),GET('/api/v1/employees')]);
      render(`<div class="stats">
        <div class="stat"><div class="stat-v tg">${gr.length}</div><div class="stat-l">Groups</div></div>
        <div class="stat"><div class="stat-v ta">${em.length}</div><div class="stat-l">Employees</div></div>
        <div class="stat"><div class="stat-v tg">${pf.total_pages||0}</div><div class="stat-l">Pages</div></div>
        <div class="stat"><div class="stat-v">${em.filter(e=>e.status==='active').length}</div><div class="stat-l">Active staff</div></div>
      </div>
      <div class="card"><div class="card-h"><div class="card-t">${pf.name}</div><div>${bdg(pf.status)}</div></div>
        <div class="card-b"><div class="row"><div><label>Groups</label><b>${pf.total_groups}</b></div><div><label>Employees</label><b>${pf.total_employees}</b></div><div><label>Pages</label><b>${pf.total_pages}</b></div></div></div>
      </div>`);
    }else{
      const[pages,deps]=await Promise.all([GET(`/api/v1/pages?group_id=${S.user.group_id}`),GET('/api/v1/depositors')]);
      render(`<div class="stats">
        <div class="stat"><div class="stat-v tg">${pages.length}</div><div class="stat-l">Your pages</div></div>
        <div class="stat"><div class="stat-v ta">${deps.length}</div><div class="stat-l">Depositors</div></div>
        <div class="stat"><div class="stat-v tg">${pages.filter(p=>p.status==='active').length}</div><div class="stat-l">Active pages</div></div>
      </div>
      <div class="card"><div class="card-h"><div class="card-t">Your pages</div></div><div class="tw"><table>
        <thead><tr><th>Name</th><th>Likes</th><th>Followers</th><th>Monthly</th><th>Status</th></tr></thead>
        <tbody>${pages.map(p=>`<tr><td><b>${p.name}</b></td><td>${num(p.current_likes)}</td><td>${num(p.followers)}</td><td class="tg">${money(p.monthly_generated_amount)}</td><td>${bdg(p.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No pages</td></tr>'}</tbody>
      </table></div></div>`);
    }
  }catch(e){render(`<div class="alert alert-e">${e.detail||'Error'}</div>`)}
}

// ─── PLATFORMS ─────────────────────────────────────────────────────────────────
async function showPlatforms(){
  setTitle('Platforms');setAct('<button class="btn btn-p btn-sm" onclick="openPfMo()">+ New</button>');
  render('<div class="empty"><div class="spinner"></div></div>');
  try{
    const d=await GET('/api/v1/platforms');
    render(`<div class="card"><div class="tw"><table>
      <thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Description</th><th>Created</th><th>Actions</th></tr></thead>
      <tbody>${d.map(p=>`<tr><td class="tm">#${p.id}</td><td><b>${p.name}</b></td><td>${bdg(p.status)}</td><td class="tm">${p.description||'—'}</td><td class="tm">${new Date(p.created_at).toLocaleDateString()}</td>
        <td><div class="td-a">
          <button class="btn btn-g btn-sm" onclick="openPfMo(${p.id},'${esc(p.name)}','${esc(p.description||'')}','${p.status}')">Edit</button>
          ${p.status!=='archived'?`<button class="btn btn-w btn-sm" onclick="archPf(${p.id},'${esc(p.name)}')">Archive</button>`:`<button class="btn btn-s btn-sm" onclick="restPf(${p.id})">Restore</button>`}
          <button class="btn btn-d btn-sm" onclick="confirmDel('${esc(p.name)}',()=>hardDelPf(${p.id}))">Delete</button>
        </div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No platforms</td></tr>'}</tbody>
    </table></div></div>`);
  }catch(e){render(`<div class="alert alert-e">${e.detail||'Error'}</div>`)}
}
function esc(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function openPfMo(id,name='',desc='',status='active'){
  const e=!!id;
  openMo(e?'Edit platform':'New platform',`<div id="merr" class="alert alert-e hidden"></div>
    <div class="fg"><label>Name</label><input id="pf-n" value="${name}"/></div>
    <div class="fg"><label>Description</label><input id="pf-d" value="${desc}"/></div>
    ${e?`<div class="fg"><label>Status</label><select id="pf-s"><option value="active" ${status==='active'?'selected':''}>Active</option><option value="suspended" ${status==='suspended'?'selected':''}>Suspended</option></select></div>`:''}`,
  `<button class="btn btn-g" onclick="closeMo()">Cancel</button><button class="btn btn-p" onclick="savePf(${id||'null'})">${e?'Save':'Create'}</button>`);
}
async function savePf(id){
  const n=$('pf-n').value.trim(),d=$('pf-d').value.trim(),err=$('merr');
  if(!n){err.textContent='Name required';err.classList.remove('hidden');return}
  try{if(id){await PATCH(`/api/v1/platforms/${id}`,{name:n,description:d||null,status:$('pf-s').value});toast('Updated');}else{await POST('/api/v1/platforms',{name:n,description:d||null});toast('Created');}closeMo();showPlatforms();}
  catch(e){err.textContent=e.detail||'Error';err.classList.remove('hidden')}
}
async function archPf(id,name){if(!confirm(`Archive "${name}"?`))return;try{await DEL(`/api/v1/platforms/${id}`);toast('Archived');showPlatforms();}catch(e){toast(e.detail||'Error','e')}}
async function restPf(id){try{await PATCH(`/api/v1/platforms/${id}`,{status:'active'});toast('Restored');showPlatforms();}catch(e){toast(e.detail||'Error','e')}}
async function hardDelPf(id){try{await api('DELETE',`/api/v1/platforms/${id}/hard`);toast('Deleted');showPlatforms();}catch(e){toast(e.detail||'Error','e')}}

    el.innerHTML=`<div class="stats"><div class="stat"><div class="stat-v">${num(r.current_likes)}</div><div class="stat-l">Likes</div></div><div class="stat"><div class="stat-v">${num(r.followers)}</div><div class="stat-l">Followers</div></div><div class="stat"><div class="stat-v tg">${money(r.total_cashin)}</div><div class="stat-l">Cash in</div></div><div class="stat"><div class="stat-v tr">${money(r.total_cashout)}</div><div class="stat-l">Cash out</div></div><div class="stat"><div class="stat-v tg">${money(r.depositor_balance)}</div><div class="stat-l">Balance</div></div><div class="stat"><div class="stat-v ta">${r.depositor_count}</div><div class="stat-l">Depositors</div></div><div class="stat"><div class="stat-v">${r.transaction_count}</div><div class="stat-l">Transactions</div></div></div>`;
  }catch(e){el.innerHTML=`<div class="alert alert-e">${e.detail||'Error'}</div>`}
}
